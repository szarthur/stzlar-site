<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<!-- Endereço-base do site. Se mudar para domínio próprio (ex.: stzlar.com.br), troque para "/" -->
<base href="/stzlar-site/">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página não encontrada — STZLAR</title>
<meta name="description" content="A página que você procurou não existe.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="STZLAR">
<meta property="og:image" content="assets/brand/logo-full.png">
<link rel="icon" type="image/x-icon" href="assets/brand/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-source.png">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,700;0,900;1,700&family=Playfair+Display:ital,wght@0,400;0,500;0,700;0,900;1,500&family=Alex+Brush&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/main.css">
<link rel="stylesheet" href="assets/css/cart.css">
<style>
.nf{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 24px; text-align:center; background:var(--bg, #F7FAFA);}
.nf-box{max-width:520px;}
.nf-logo{width:min(220px,55vw); height:auto; margin:0 auto 30px; display:block;}
.nf-code{font-family:var(--serif, 'Playfair Display', serif); font-size:clamp(64px,16vw,110px); line-height:1; color:var(--blue); margin-bottom:6px;}
.nf h1{font-family:var(--serif, 'Playfair Display', serif); font-weight:500; font-size:clamp(24px,5vw,32px); margin-bottom:12px;}
.nf p{font-size:16px; line-height:1.6; margin-bottom:30px;}
.nf-actions{display:flex; gap:14px; justify-content:center; flex-wrap:wrap;}
.nf-btn{display:inline-flex; padding:15px 30px; background:var(--blue); color:#fff; font-size:12px; letter-spacing:.2em; text-transform:uppercase; font-weight:500;}
.nf-btn.alt{background:transparent; color:var(--blue); border:1px solid var(--blue);}
</style>
</head>
<body>
<main class="nf">
  <div class="nf-box">
    <img class="nf-logo" src="assets/brand/logo-full.png" alt="STZLAR">
    <div class="nf-code" aria-hidden="true">404</div>
    <h1>Página não encontrada</h1>
    <p>O endereço que você abriu não existe ou foi movido. Que tal voltar para a loja?</p>
    <div class="nf-actions">
      <a class="nf-btn" href="index.html">Ir para a loja</a>
      <a class="nf-btn alt" href="catalogo.html">Ver catálogo</a>
    </div>
  </div>
</main>
</body>
</html>
